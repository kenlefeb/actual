# Fork-only: build the app before merge, so a broken browser build or Docker
# image shows up here, not at the actual-hosting staging build (sc-626).
# Separate from fork-ci.yml: each job gets its own runner, so build:browser's
# leftover packages/*/@types and dist never reach a typecheck. Never upstream
# (fork/README.md).
name: Fork build

on:
  pull_request:
    branches:
      - development
  push:
    branches:
      - development

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Both jobs always report, so they can be required checks; a scope step
  # skips the work on a pull request that can't affect it. Pushes always build.
  browser-build:
    if: github.repository == 'kenlefeb/actual'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # A pull request checks out its merge commit; HEAD^1 is the base.
          fetch-depth: 2
      - name: Decide whether the browser build applies
        id: scope
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # Captured first so a failing diff fails the job instead of
            # skipping the build; --no-renames keeps a moved file's old path.
            changed=$(git diff --no-renames --name-only HEAD^1 HEAD)
          fi
          if [ "$GITHUB_EVENT_NAME" != pull_request ] ||
            printf '%s\n' "$changed" | grep -Eq '^(packages/|bin/|\.yarn/|yarn\.lock$|package\.json$|\.yarnrc\.yml$|\.nvmrc$|lage\.config\.js$|tsconfig\.json$|\.github/actions/setup/|\.github/workflows/fork-build\.yml$)'; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo 'No app or build changes; skipping the browser build.'
            echo run=false >> "$GITHUB_OUTPUT"
          fi
      - name: Set up environment
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/setup
        with:
          download-translations: 'false'
      - name: Build the browser app
        if: steps.scope.outputs.run == 'true'
        run: yarn build:browser --skip-translations

  docker-build:
    if: github.repository == 'kenlefeb/actual'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Decide whether the Docker build applies
        id: scope
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            changed=$(git diff --no-renames --name-only HEAD^1 HEAD)
          fi
          # Dependencies, the files the image's deps stage copies, and the Docker files
          if [ "$GITHUB_EVENT_NAME" != pull_request ] ||
            printf '%s\n' "$changed" | grep -Eq '^(yarn\.lock|package\.json|packages/[^/]+/package\.json|\.yarnrc\.yml|\.yarn/.*|bin/package-browser|sync-server\.Dockerfile|Dockerfile|\.dockerignore|\.github/workflows/fork-build\.yml)$'; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo 'No dependency or Docker changes; skipping the Docker build.'
            echo run=false >> "$GITHUB_OUTPUT"
          fi
      # The same image the actual-hosting staging build makes
      - name: Build the sync-server image
        if: steps.scope.outputs.run == 'true'
        run: docker build -f sync-server.Dockerfile -t actual-fork-build:ci .
