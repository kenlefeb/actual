# Fork-only CI on GitHub-hosted runners; the inherited upstream workflows need
# Depot runners and are disabled in this fork. Never upstream (fork/README.md).
name: Fork CI

on:
  pull_request:
    branches:
      - development
  push:
    branches:
      - development

permissions:
  contents: read

# A PR cancels its own superseded runs. Every push to development gets its own
# group and is never cancelled, so each merged commit has a full result (sc-946).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.repository == 'kenlefeb/actual'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          download-translations: 'false'
      - name: Typecheck
        run: yarn typecheck
      - name: Lint
        run: yarn lint
      - name: Test
        run: yarn test

  # Links between OpenSpec changes and Shortcut stories
  # (docs/agents/issue-tracker.md). Needs only Node, so it skips the setup.
  openspec-shortcut:
    if: github.repository == 'kenlefeb/actual'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # A pull request checks out its merge commit; HEAD^1 is the base.
          fetch-depth: 2
      # Strict mode fails on warnings such as requirement text over 500 characters (sc-3071).
      - name: Validate OpenSpec specs
        run: npx --yes @fission-ai/openspec@1.15.0 validate --specs --strict
      - name: Test the check
        run: node --test fork/scripts/*.test.mjs
      - name: Check OpenSpec and Shortcut links
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            node fork/scripts/check-openspec-shortcut.mjs --base HEAD^1 --require-story
          else
            node fork/scripts/check-openspec-shortcut.mjs
          fi

  # The repo-admin agent hook blocks and allows what sc-696 says. Needs only
  # jq (preinstalled on GitHub-hosted runners) and the checkout.
  agent-hooks:
    if: github.repository == 'kenlefeb/actual'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Test the repo-admin hook
        run: sh scripts/agent-hooks/no-repo-admin.test.sh

  # Every server handler and API export maps to an MCP tool or a skip with a
  # reason (sc-1570). Needs only Node and the checkout.
  mcp-coverage:
    if: github.repository == 'kenlefeb/actual'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check MCP coverage
        run: node fork/scripts/check-mcp-coverage.mjs

  # The eight release packages share one version (sc-1573). Needs only Node and
  # the checkout.
  package-versions:
    if: github.repository == 'kenlefeb/actual'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check package versions
        run: node fork/scripts/check-package-versions.mjs

  # Mobile e2e in the same Docker setup as actual-hosting's staging build
  # (sc-625). The job always reports `mobile-e2e`, so it can be a required
  # check; its scope step skips the run only when every changed file is docs,
  # OpenSpec, fork notes or Markdown. Needs no secrets. It also runs the
  # desktop e2e tests that need a sync server (sign-out.test.ts, sc-2915),
  # since upstream's e2e workflow never runs in the fork.
  mobile-e2e:
    if: github.repository == 'kenlefeb/actual'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # A pull request checks out its merge commit; HEAD^1 is the base.
          fetch-depth: 2
      - name: Decide whether the mobile e2e tests apply
        id: scope
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # Captured first so a failing diff fails the job instead of skipping
            # the tests; --no-renames keeps the old path of a moved file, and
            # quotePath=false keeps unusual file names unquoted.
            changed=$(git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD)
          fi
          # Skip only when every changed file is known safe; anything else runs.
          if [ "$GITHUB_EVENT_NAME" != pull_request ] ||
            printf '%s\n' "$changed" | grep -Ev '^(docs/|openspec/|fork/|upcoming-release-notes/)|\.md$' | grep -q .; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo 'Only docs, OpenSpec, fork notes or Markdown changed; skipping mobile e2e.'
            echo run=false >> "$GITHUB_OUTPUT"
          fi
      - name: Build the dependency image
        if: steps.scope.outputs.run == 'true'
        run: docker build --target deps -f sync-server.Dockerfile -t actual-mobile-deps .
      - name: Mobile e2e
        if: steps.scope.outputs.run == 'true'
        # Chromium crashes in Docker without a larger /dev/shm.
        run: |
          docker run --rm --shm-size=2g --mount "type=bind,src=$PWD,dst=/app" -v actual-mobile-modules:/app/node_modules -v actual-mobile-yarn-cache:/app/.yarn/cache actual-mobile-deps sh -eu -c '
            git config --global --add safe.directory /app
            yarn install --immutable
            yarn workspace @actual-app/web playwright install --with-deps chromium
            E2E_WORKERS=1 yarn workspace @actual-app/web playwright test mobile.test.ts sign-out.test.ts --workers=1 --retries=0 --reporter=line
          '
      - name: Upload the Playwright results
        if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-e2e-results
          path: packages/desktop-client/test-results/
          retention-days: 7

  # Visual regression for the phone UI (sc-977). Snapshots are Linux-only and
  # must match the pinned Playwright image (keep in sync with e2e-test.yml and
  # bin/run-vrt); the Debian-based mobile-e2e image renders fonts differently,
  # so this is a separate job. `yarn vrt` sets VRT=true, which turns on
  # toMatchThemeScreenshots. Same docs-only skip as mobile-e2e.
  mobile-vrt:
    if: github.repository == 'kenlefeb/actual'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    env:
      E2E_USE_BUILD: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Trust the repository directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Decide whether the mobile VRT applies
        id: scope
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            changed=$(git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD)
          fi
          if [ "$GITHUB_EVENT_NAME" != pull_request ] ||
            printf '%s\n' "$changed" | grep -Ev '^(docs/|openspec/|fork/|upcoming-release-notes/)|\.md$' | grep -q .; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo 'Only docs, OpenSpec, fork notes or Markdown changed; skipping mobile VRT.'
            echo run=false >> "$GITHUB_OUTPUT"
          fi
      - name: Set up environment
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/setup
        with:
          download-translations: 'false'
      - name: Build browser bundle
        if: steps.scope.outputs.run == 'true'
        # REACT_APP_NETLIFY keeps the "Create test file" button in the bundle;
        # --skip-translations renders source English (same as e2e-test.yml).
        env:
          REACT_APP_NETLIFY: 'true'
        run: yarn build:browser --skip-translations
      - name: Mobile VRT
        if: steps.scope.outputs.run == 'true'
        # One retry (the config default) absorbs a screenshot taken mid-spinner.
        run: yarn vrt mobile
      - name: Upload the Playwright results
        if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-vrt-results
          path: packages/desktop-client/test-results/
          retention-days: 7
