# Fork-only (sc-5054). Builds the iPhone App target for the simulator, unsigned,
# so a compile break in the Xcode project is caught on the PR. `swift test`
# builds NativeBridgeCore as a package and misses what is specific to the
# project (development's iPhone app stopped compiling on 2026-11-17 with every
# check green). Never upstream (fork/README.md). Needs no secrets, no signing
# and no upload, and it publishes nothing: fork-ios.yml stays the only release
# path. Runs only when the iPhone app, the native bridge page code or this job
# changes, because macOS runner time is the scarce resource.
name: Fork iOS simulator

on:
  pull_request:
    branches:
      - development
    paths:
      - 'packages/mobile-client/ios/**'
      - 'packages/desktop-client/src/native/**'
      - '.github/workflows/fork-ios-simulator.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fork-ios-simulator:
    if: github.repository == 'kenlefeb/actual'
    runs-on: macos-26
    # A cold runner spends minutes on the first simulator boot, the web build and the build
    timeout-minutes: 45
    env:
      # CocoaPods fails on a non-UTF-8 locale
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          download-translations: 'false'

      - name: Build web app
        run: yarn build:browser --skip-translations

      # The installed pods and CocoaPods' download cache, keyed on what pins them
      - name: Cache CocoaPods
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            packages/mobile-client/ios/App/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('packages/mobile-client/ios/App/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Sync the native project
        run: yarn workspace mobile-client sync:ios

      # One xcodebuild builds the app unsigned for the simulator (the sc-5054
      # compile check) and runs the UI tests on it (sc-5177). No sign-in and no
      # network: the tests launch the Debug-only fixture host (UITestAccounts.swift).
      - name: Build the iPhone app and run the UI tests on the simulator
        working-directory: packages/mobile-client
        run: |
          UDID="$(xcrun simctl list devices available iPhone -j | node -e '
            const d = JSON.parse(require("fs").readFileSync(0, "utf8")).devices;
            const phones = Object.entries(d).filter(([k]) => k.includes("iOS")).flatMap(([, v]) => v);
            console.log(phones[phones.length - 1].udid)')"
          xcrun simctl boot "$UDID" || true
          # Wait for the boot to finish: the first test's launch used to race it
          xcrun simctl bootstatus "$UDID" -b > /dev/null
          ARGS=(-workspace ios/App/App.xcworkspace -scheme App
            -configuration Debug -sdk iphonesimulator
            -destination "id=$UDID"
            -derivedDataPath "$RUNNER_TEMP/dd"
            CODE_SIGNING_ALLOWED=NO)
          xcodebuild "${ARGS[@]}" build-for-testing
          # sc-5540: the first launch of the app on a cold simulator is the slow
          # one, and the test runner once gave up attaching to it ("Failed to get
          # background assertion for target app", 36 s). Launch it once outside
          # any test so the first test starts on a warm simulator. Not a retry: a
          # test that fails still fails.
          xcrun simctl install "$UDID" "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl launch --terminate-running-process "$UDID" com.actualbudget.actual -UITestAccounts YES || true
          sleep 5
          xcrun simctl terminate "$UDID" com.actualbudget.actual || true
          xcodebuild "${ARGS[@]}" -resultBundlePath "$RUNNER_TEMP/ui-tests.xcresult" test-without-building

      # sc-5496: the same app on a page built with a slow open (above the engine's 4 s
      # open wait): the Accounts list must load with no tap on Retry. A Debug simulator
      # build only; check-release-page.sh refuses this page in a Release build.
      # Runs even when an earlier test step failed, so the evidence for this test is never
      # blocked by an unrelated flake (the PageDialogs tests, sc-5540). The job still fails
      # overall if any step failed, so nothing is weakened.
      - name: Build the slow-open page and run its UI test
        if: ${{ !cancelled() }}
        working-directory: packages/mobile-client
        env:
          FORK_TEST_HOOKS: 'true'
          FORK_TEST_SLOW_OPEN_MS: '6000'
          TEST_RUNNER_SLOW_OPEN: '1'
        run: |
          (cd ../.. && yarn build:browser --skip-translations)
          yarn sync:ios
          UDID="$(xcrun simctl list devices available iPhone -j | node -e '
            const d = JSON.parse(require("fs").readFileSync(0, "utf8")).devices;
            const phones = Object.entries(d).filter(([k]) => k.includes("iOS")).flatMap(([, v]) => v);
            console.log(phones[phones.length - 1].udid)')"
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination "id=$UDID" \
            -only-testing:AppUITests/SlowOpenUITests \
            CODE_SIGNING_ALLOWED=NO test

      # The result bundle holds the failure screenshots and the UI hierarchy
      - name: Keep the test results on a failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-tests-xcresult
          path: ${{ runner.temp }}/ui-tests.xcresult
          retention-days: 7
