# Fork-only (sc-4953): build the SwiftUI Mac app "Home Economics"
# (packages/mobile-client/macos) and upload it to TestFlight for Mac for
# internal testing only. Never upstream (fork/README.md). Not the Electron app:
# "Fork Mac" (fork-mac.yml) builds that one under app.homeeconomics.budget.
#
# The Mac app has its own bundle id and App Store Connect record while it runs
# beside the Electron app (Ken, 2026-11-17), so the two never share a sandbox
# container or data. When it replaces Electron it moves to the macOS slot of
# app.homeeconomics.budget.
#
# Run it by hand (Actions -> Fork Mac native TestFlight -> Run workflow) from
# the development branch, with the commit to build (default: its head). Nothing
# else starts it. Three gates stand before the upload:
#
# - the run must be on development, and the commit (a full SHA) must be
#   on development's first-parent history (a merge or landing point, never an
#   intermediate commit of a merged PR), so only reviewed code is built;
# - fork/mac-testflight.json on development's head must say "held": false. It
#   ships held; changing it to false in a reviewed PR is the approval for
#   uploads, and setting it back to true there blocks them again;
# - Fork CI must have passed on the commit.
#
# Before the first upload, Ken creates the App Store Connect app record: the
# API cannot create one. App Store Connect -> Apps -> + -> New App: platform
# macOS, name "Home Economics Native" (any free name), bundle id
# app.homeeconomics.budget.mac (registered by the first run, or by hand under
# Certificates, IDs & Profiles), SKU app-homeeconomics-budget-mac. Nothing
# else needs creating by hand: the first export registers the App ID and
# creates the Mac distribution certificates and provisioning profile through
# the API key (cloud signing).
#
# Repository secrets, the same ones fork-ios.yml uses (see there):
# ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (Admin role) and APPLE_TEAM_ID.
#
# The archive is signed ad hoc (so it carries its entitlements) and
# xcodebuild's export re-signs it with Apple-managed distribution certificates,
# as in fork-ios.yml. The signed package is checked (signature and App Sandbox
# entitlement) before anything is uploaded.

name: Fork Mac native TestFlight

# The revision is in the title so a dispatcher can find exactly the run it started.
run-name: Fork Mac native TestFlight ${{ inputs.revision || github.sha }}

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Commit to build (default: the selected branch's head)"
        required: false
        type: string

concurrency:
  group: fork-mac-native-testflight
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUNDLE_ID: app.homeeconomics.budget.mac
  CODEMAGIC: codemagic-cli-tools==0.70.0

jobs:
  # No signing secrets: it only decides whether the build may go ahead.
  gate:
    if: github.repository == 'kenlefeb/actual'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The selected branch (development) with all its history, not the
          # revision: the checks below read development, never the revision.
          fetch-depth: 0
      - name: Check the run may upload
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_REF: ${{ github.ref }}
          REVISION: ${{ inputs.revision || github.sha }}
        run: |
          if [ "$RUN_REF" != refs/heads/development ]; then
            echo "::error::Run this workflow on the development branch, not $RUN_REF"
            exit 1
          fi
          # Only reviewed code reaches TestFlight: a full SHA that development
          # landed as a first-parent commit, not a branch, PR or intermediate PR commit.
          echo "$REVISION" | grep -Eq '^[0-9a-f]{40}$' || { echo '::error::revision must be a full 40-character commit SHA'; exit 1; }
          git rev-list --first-parent origin/development | grep -qx "$REVISION" || { echo "::error::$REVISION is not a first-parent commit of the development branch"; exit 1; }
          # The switch is read from development's head, so putting held back to
          # true there blocks every upload, whatever the revision holds.
          HELD="$(git show origin/development:fork/mac-testflight.json | jq -r '.held')"
          case "$HELD" in true|false) ;; *) echo '::error::fork/mac-testflight.json held must be true or false'; exit 1 ;; esac
          if [ "$HELD" = true ]; then
            echo '::error::Mac TestFlight uploads are held. Set held to false in fork/mac-testflight.json (a reviewed PR) to allow them.'
            exit 1
          fi
          PASSED="$(gh run list -R "$GITHUB_REPOSITORY" -w fork-ci.yml --commit "$REVISION" --status success --json conclusion --jq length)"
          if [ "$PASSED" -lt 1 ]; then
            echo "::error::Fork CI has not passed on $REVISION"
            exit 1
          fi

  testflight:
    needs: gate
    # Apple accepts uploads built with the macOS 26 SDK or later.
    runs-on: macos-26
    # Includes up to 45 minutes waiting for Apple to process the build.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.sha }}

      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          # Avoid restoring potentially poisoned caches in release jobs.
          cache: 'false'

      # Build before any signing material lands on the runner.
      - name: Build web app
        run: yarn build:browser

      - name: Stage it for the Mac app
        run: yarn workspace mobile-client stage:www

      # The page the archive will carry holds no storage test hook.
      - name: Check the staged page holds no test hooks
        run: node fork/scripts/check-test-hooks.mjs packages/mobile-client/www

      - name: Release defines no DEBUG
        run: fork/scripts/check-mac-release-flags.sh

      - name: Work out the versions
        id: version
        run: |
          VERSION="$(node -p "require('./packages/mobile-client/package.json').version")"
          {
            echo "version=$VERSION"
            echo "marketing=$(node fork/scripts/apple-version.mjs "$VERSION")"
            # Always increases, so every upload has a new build number.
            echo "build=$(date -u +%Y%m%d%H%M)"
            echo "commit=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Archive
        working-directory: packages/mobile-client/macos
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          xcodebuild -version
          xcodebuild -project HomeEconomicsMac.xcodeproj -scheme HomeEconomicsMac \
            -configuration Release -destination generic/platform=macOS \
            -archivePath build/HomeEconomicsMac.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- archive

      # Not CODE_SIGNING_ALLOWED=NO as for iOS: an unsigned Mac archive carries
      # no entitlements (checked 2026-11-22), so the export would sign an
      # unsandboxed app. The ad hoc signature above embeds them and needs no
      # Apple account; the export replaces it with the distribution signature.
      - name: Check the archive holds the sandbox entitlement
        working-directory: packages/mobile-client/macos
        run: |
          codesign -d --entitlements - "build/HomeEconomicsMac.xcarchive/Products/Applications/Home Economics.app" 2>&1 |
            grep -q 'com.apple.security.app-sandbox' ||
            { echo '::error::The archived app holds no App Sandbox entitlement'; exit 1; }

      - name: Export the signed package
        working-directory: packages/mobile-client/macos
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # The secret may have lost its line breaks; rebuild a valid PEM.
          umask 077
          printf '%s' "$API_KEY_P8" | node ../../../fork/scripts/normalize-pem.mjs > "$RUNNER_TEMP/AuthKey.p8"
          cp ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath build/HomeEconomicsMac.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath build/export \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$API_KEY_ID" -authenticationKeyIssuerID "$API_ISSUER_ID"

      # An unsandboxed or unsigned package would be rejected by Apple after a
      # 45-minute wait, so fail here instead.
      - name: Check the package is signed and sandboxed
        working-directory: packages/mobile-client/macos/build
        run: |
          PKG="$(ls export/*.pkg)"
          pkgutil --check-signature "$PKG"
          pkgutil --expand-full "$PKG" expanded
          APP="$(find expanded -name '*.app' -maxdepth 3 | head -n 1)"
          test -n "$APP" || { echo '::error::No app inside the package'; exit 1; }
          codesign --verify --deep --strict "$APP"
          codesign -d --entitlements - "$APP" 2>&1 | grep -q 'com.apple.security.app-sandbox' ||
            { echo '::error::The exported app is not sandboxed'; exit 1; }
          BUNDLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")"
          test "$BUNDLE" = "$BUNDLE_ID" || { echo "::error::The exported app is $BUNDLE, not $BUNDLE_ID"; exit 1; }

      # Without --testflight nothing goes to Beta App Review. The build is
      # uploaded as internal-only; Ken's internal "Testers" group has access to
      # all builds, so Apple distributes it there.
      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          export APP_STORE_CONNECT_PRIVATE_KEY="@file:$RUNNER_TEMP/AuthKey.p8"
          # Its own statement: a failure inside $(...) of the command below
          # would not stop the step and would upload with empty notes.
          WHATS_NEW="$(node fork/scripts/mac-whats-new.mjs "$VERSION" "$COMMIT")"
          pipx run --spec "$CODEMAGIC" app-store-connect publish \
            --path 'packages/mobile-client/macos/build/export/*.pkg' --platform MAC_OS \
            --max-find-build-wait 45 --max-build-processing-wait 45 \
            --whats-new "$WHATS_NEW"

      - name: Clean up signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Summarize build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          {
            echo "## Mac build"
            echo
            echo "| Version | Apple version | Build | Commit |"
            echo "| --- | --- | --- | --- |"
            echo "| $VERSION | $MARKETING_VERSION | $BUILD_NUMBER | $COMMIT |"
          } >> "$GITHUB_STEP_SUMMARY"
          jq -n --arg version "$VERSION" --arg marketing "$MARKETING_VERSION" \
            --arg build "$BUILD_NUMBER" --arg commit "$COMMIT" \
            '{version: $version, marketingVersion: $marketing, buildNumber: $build, commit: $commit}' \
            > "$RUNNER_TEMP/mac-build.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-build
          path: ${{ runner.temp }}/mac-build.json
          retention-days: 90
