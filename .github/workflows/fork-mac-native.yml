# Fork-only (sc-4942, add-mac-app-shell): builds the SwiftUI Mac app unsigned
# and runs its unit tests. Never upstream (fork/README.md). Needs no secrets
# and no web build: the app's www copy phase skips a missing folder. Runs only
# when the Mac app or NativeBridgeCore changes, because macOS runner minutes
# are expensive.
name: Fork Mac native

on:
  pull_request:
    branches:
      - development
    paths:
      - 'packages/mobile-client/macos/**'
      - 'packages/mobile-client/ios/NativeBridge/**'
      - '.github/workflows/fork-mac-native.yml'
      - 'fork/scripts/check-mac-release-flags.sh'
      # What the storage perf gate measures (sc-5219)
      - 'packages/desktop-client/src/native/**'
      - 'packages/loot-core/src/platform/server/fs/**'
      - 'packages/loot-core/src/server/native/persisted.ts'
      - '.yarn/patches/absurd-sql-*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # sc-5219 (native-durable-writes D11): the web build the perf gate runs on.
  # Built on Linux because macOS runner minutes are expensive. It keeps the test
  # hooks, so it is only ever used here.
  storage-perf-www:
    if: github.repository == 'kenlefeb/actual'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          download-translations: 'false'
      - name: Build the web app with the test hooks
        run: yarn build:browser --skip-translations
        env:
          FORK_TEST_HOOKS: 'true'
          # sc-5496: every open waits this long (above the engine's 4 s open wait), so
          # BudgetOpenedTests can show a read made during a slow open ending loaded
          FORK_TEST_SLOW_OPEN_MS: '6000'
      - name: Stage it for the Mac app
        run: yarn workspace mobile-client stage:www
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storage-perf-www
          path: packages/mobile-client/www
          retention-days: 1
          if-no-files-found: error

  storage-perf-gate:
    if: github.repository == 'kenlefeb/actual'
    needs: storage-perf-www
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: storage-perf-www
          path: packages/mobile-client/www
      - name: Measure what the storage barrier adds to a write
        working-directory: packages/mobile-client/macos
        env:
          TEST_RUNNER_HE_STORAGE_PERF_GATE: '1'
        run: >-
          xcodebuild test
          -project HomeEconomicsMac.xcodeproj
          -scheme HomeEconomicsMac
          -destination platform=macOS
          -only-testing:HomeEconomicsMacTests/StoragePerfGateTests
          CODE_SIGNING_ALLOWED=NO
      # sc-5496: the same staged page, a slow open (no Release or archive build bundles it)
      - name: Show a read during a slow open ends loaded, through the real event path
        working-directory: packages/mobile-client/macos
        env:
          TEST_RUNNER_HE_SLOW_OPEN: '1'
        run: >-
          xcodebuild test
          -project HomeEconomicsMac.xcodeproj
          -scheme HomeEconomicsMac
          -destination platform=macOS
          -only-testing:HomeEconomicsMacTests/BudgetOpenedTests
          CODE_SIGNING_ALLOWED=NO

  fork-mac-native:
    if: github.repository == 'kenlefeb/actual'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build and test the Mac app, unsigned
        working-directory: packages/mobile-client/macos
        run: >-
          xcodebuild build test
          -project HomeEconomicsMac.xcodeproj
          -scheme HomeEconomicsMac
          -destination platform=macOS
          CODE_SIGNING_ALLOWED=NO
      # Story 5186: Debug builds let Safari's Web Inspector read the page;
      # Release must never define DEBUG
      - name: Release defines no DEBUG
        run: fork/scripts/check-mac-release-flags.sh
      - name: Test the Release configuration
        working-directory: packages/mobile-client/macos
        run: >-
          xcodebuild test
          -project HomeEconomicsMac.xcodeproj
          -scheme HomeEconomicsMac
          -destination platform=macOS
          -configuration Release
          ENABLE_TESTABILITY=YES
          CODE_SIGNING_ALLOWED=NO
